# Reusable "prepare" half of the desktop release: build the QwenPaw Desktop
# ELECTRON packages for Windows / macOS / Linux (arm64), run the install/launch
# verification (placeholder; see note), and upload the installers as run
# artifacts.
#
# This replaces the former Tauri build jobs. Electron bundles its own Chromium +
# Node and needs no system WebKitGTK / libsoup, so the desktop shell now runs on
# glibc 2.31 targets (Kylin V10 SP1 / Ubuntu 20.04) where Tauri 2 could not.
#
# The Linux arm64 job intentionally runs inside an ubuntu:20.04 container so the
# backend onedir + helper link against glibc 2.31 (linking against 22.04/24.04
# would produce a package the target OS cannot load).
#
# Verification: each build job now launches its own artifact headless (to start
# the bundled backend) and drives the SPA through the shared Playwright verifier
# via the verify-electron-* actions — closing the CI gate the Tauri jobs had.
# The app is launched headless purely to boot the backend; an independent
# headless Chromium loads the SPA over HTTP, so no display server is required
# (and the Linux arm64 job runs inside the ubuntu:20.04 container without Xvfb).
#
# This workflow performs NO publishing. It is called by release.yml during the
# prepare phase (pinned to the release commit via `ref`), and can also be run
# standalone via workflow_dispatch to validate a packaging change.
#
# The matching publish half lives in desktop-publish.yml.

name: Desktop Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref/SHA to build (pins the build to the release commit)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to build (default: this workflow's ref)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-electron-linux-arm64:
    # Backend + Electron shell .deb for Kylin V10 SP1 (glibc 2.31).
    # Runs inside an ubuntu:20.04 arm64 container so the bundled backend/helper
    # link against glibc 2.31.
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      # Pin the CPython X.Y staged for the backend: the container's own python3
      # (3.8 on focal) is only the bootstrap for the staging script, so the
      # version to download must not be derived from it.
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
      # electron-builder's bundled fpm is a self-contained *linux-x86* ruby
      # build and there is no arm64 flavour of it, so on this arm64 runner the
      # deb target dies with "Exec format error" right after downloading it.
      # app-builder honours this variable and uses `fpm` from PATH instead.
      USE_SYSTEM_FPM: "true"
    steps:
      - name: Install git (the ubuntu:20.04 image does not ship it)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Install system build dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget file git \
            build-essential pkg-config \
            python3 python3-venv python3-dev \
            dpkg ruby ruby-dev

      - name: Install fpm
        # Only needed because this job builds its deb on arm64 (see
        # USE_SYSTEM_FPM above). Whatever version rubygems resolves is fine --
        # gem only offers releases whose required_ruby_version focal's ruby
        # satisfies. The symlink is belt-and-braces: depending on how the
        # distro configures RubyGems, the executable can land outside PATH.
        run: |
          set -eux
          gem install --no-document fpm
          gem_bindir="$(ruby -e 'print Gem.bindir')"
          if [ ! -x "$gem_bindir/fpm" ]; then
            echo "::error::gem installed fpm but no executable at $gem_bindir/fpm"
            exit 1
          fi
          # On focal, `Gem.bindir` is already /usr/local/bin, so the symlink
          # would be a no-op self-link and `ln -sf src src` exits 1 (and `set -e`
          # then kills the step). Only link when the executable lives elsewhere.
          if [ "$gem_bindir" != "/usr/local/bin" ]; then
            ln -sf "$gem_bindir/fpm" /usr/local/bin/fpm
          fi
          command -v fpm
          fpm --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build Electron Linux package (.deb)
        env:
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/pack-electron/build_linux.sh
          bash scripts/pack-electron/build_linux.sh

      - name: Generate Linux artifact checksums
        shell: bash
        run: |
          shopt -s nullglob
          debs=(dist/QwenPaw-*-linux-*.deb)
          if [ ${#debs[@]} -ne 1 ]; then
            echo "::error::Expected exactly one Linux .deb, found ${#debs[@]}"
            exit 1
          fi
          for artifact in "${debs[0]}"; do
            (
              cd "$(dirname "$artifact")"
              sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
            )
          done

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Linux-arm64-${{ steps.version.outputs.version }}
          path: |
            dist/QwenPaw-*-linux-*.deb
            dist/QwenPaw-*-linux-*.deb.sha256

      - name: Verify Electron package (Linux)
        uses: ./.github/actions/verify-electron-linux
        with:
          dashscope-api-key: ${{ secrets.DASHSCOPE_API_KEY }}
          allow-flaky-llm: "true"

  build-electron-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Pin the CPython X.Y staged for the backend + helper runtime: it has to
      # match the frozen backend, not whatever `python3` the runner happens to
      # resolve (see the same pin on the Linux arm64 job).
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Set up Rust
        # Builds console/native/computer-use-helper (the Computer Use sidecar the
        # Electron shell spawns); scripts/pack-electron/build_win.sh runs cargo.
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/native/computer-use-helper

      - name: Build Electron Windows package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/pack-electron/build_win.sh

      - name: Generate Windows artifact checksum
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem "dist/QwenPaw-*-win-*.exe")
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($artifacts.Count)"
          }
          $artifact = $artifacts[0]
          $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -Encoding ascii "$($artifact.FullName).sha256"
          Write-Host "Checksum written: $($artifact.FullName).sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/QwenPaw-*-win-*.exe
            dist/QwenPaw-*-win-*.exe.sha256

      - name: Verify Electron package (Windows)
        uses: ./.github/actions/verify-electron-windows
        with:
          dashscope-api-key: ${{ secrets.DASHSCOPE_API_KEY }}
          allow-flaky-llm: "true"

  build-electron-macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Pin the CPython X.Y staged for the backend + helper runtime: it has to
      # match the frozen backend, not whatever `python3` the runner happens to
      # resolve (see the same pin on the Linux arm64 job).
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Set up Rust
        # Builds console/native/computer-use-helper (the Computer Use sidecar the
        # Electron shell spawns); build_macos.sh runs cargo and stages the binary.
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/native/computer-use-helper

      - name: Build Electron macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/pack-electron/build_macos.sh
          bash scripts/pack-electron/build_macos.sh

      - name: Generate macOS artifact checksums
        run: |
          shopt -s nullglob
          zips=(dist/QwenPaw-*-mac-*.zip)
          dmgs=(dist/QwenPaw-*-mac-*.dmg)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::Expected exactly one macOS zip, found ${#zips[@]}"
            exit 1
          fi
          for artifact in "${zips[0]}" "${dmgs[0]}"; do
            (
              cd "$(dirname "$artifact")"
              shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256"
            )
          done

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-macOS-${{ steps.version.outputs.version }}
          path: |
            dist/QwenPaw-*-mac-*.zip
            dist/QwenPaw-*-mac-*.zip.sha256
            dist/QwenPaw-*-mac-*.dmg
            dist/QwenPaw-*-mac-*.dmg.sha256

      - name: Verify Electron package (macOS)
        uses: ./.github/actions/verify-electron-macos
        with:
          dashscope-api-key: ${{ secrets.DASHSCOPE_API_KEY }}
          allow-flaky-llm: "true"
