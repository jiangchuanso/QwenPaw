# One-click desktop release verification for fork repositories.
# Builds the QwenPaw Desktop ELECTRON packages (macOS + Windows) end to end.
#
# Unlike desktop-release.yml this workflow does NOT upload artifacts to
# a GitHub Release or OSS — it only verifies that the packaging works.
# Use it to validate packaging changes before opening a PR.
#
# Verification: each platform job launches its own artifact headless (to start
# the bundled backend) and drives the SPA through the shared Playwright verifier
# via the verify-electron-* actions, so this workflow validates the running app
# end to end — not just that the installer was produced.
#
# Usage: Actions → Fork Desktop Release Verification → Run workflow.

name: Fork Desktop Release Verification

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to verify'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'macos-only'
          - 'windows-only'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-macos:
    if: >-
      inputs.platforms == 'all' ||
      inputs.platforms == 'macos-only'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Pin the CPython X.Y staged for the backend + helper runtime: it has to
      # match the frozen backend, not whatever `python3` the runner happens to
      # resolve (see the same pin on the Linux arm64 job).
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        # Builds console/native/computer-use-helper (the Computer Use sidecar the
        # Electron shell spawns); build_macos.sh runs cargo and stages the binary.
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/native/computer-use-helper

      - name: Build Electron macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/pack-electron/build_macos.sh
          bash scripts/pack-electron/build_macos.sh

      - name: Verify macOS artifact present
        run: |
          shopt -s nullglob
          zips=(dist/QwenPaw-*-mac-*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::Expected exactly one macOS zip, found ${#zips[@]}"
            exit 1
          fi
          echo "Built: ${zips[0]} ($(du -h "${zips[0]}" | cut -f1))"

      - name: Verify Electron package (macOS)
        uses: ./.github/actions/verify-electron-macos
        with:
          dashscope-api-key: ${{ secrets.DASHSCOPE_API_KEY }}
          allow-flaky-llm: "true"

  electron-windows:
    if: >-
      inputs.platforms == 'all' ||
      inputs.platforms == 'windows-only'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Pin the CPython X.Y staged for the backend + helper runtime: it has to
      # match the frozen backend, not whatever `python3` the runner happens to
      # resolve (see the same pin on the Linux arm64 job).
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Set up Rust
        # Builds console/native/computer-use-helper (the Computer Use sidecar the
        # Electron shell spawns); scripts/pack-electron/build_win.sh runs cargo.
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/native/computer-use-helper

      - name: Build Electron Windows package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/pack-electron/build_win.sh

      - name: Verify Windows artifact present
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/QwenPaw-*-win-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Electron Windows installer found in dist/" }
          Write-Host "Built: $($installer.FullName) ($([Math]::Round($installer.Length / 1MB, 2)) MiB)"

      - name: Verify Electron package (Windows)
        uses: ./.github/actions/verify-electron-windows
        with:
          dashscope-api-key: ${{ secrets.DASHSCOPE_API_KEY }}
          allow-flaky-llm: "true"
