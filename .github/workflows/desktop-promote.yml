# Reusable "promote" step of the desktop release — runs ONLY after the release
# has been flipped to published (called by release.yml's post-finalize job).
#
# It promotes the already-uploaded versioned OSS files to `latest` and refreshes
# the desktop + main index. Splitting this out of desktop-publish.yml ensures
# existing users downloading `latest` are never pointed at a version whose
# release/PyPI/Docker publish might still have failed.
#
# Electron-only: the former Tauri auto-updater manifest (qwenpaw-tauri-latest.json)
# is intentionally NOT generated — auto-update is out of scope for the Electron
# migration. Skipped entirely when dry_run=true (fork verification never touches
# prod OSS).

name: Desktop Promote (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "Published release tag (for updater manifest notes)"
        type: string
        required: true
      ref:
        description: "Release target ref/SHA used for product source and version"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Skip promotion entirely (fork verification)"
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

jobs:
  promote-oss:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'qwenpaw-download' }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL || 'https://download.qwenpaw.agentscope.io/files/apps/desktop' }}
      RELEASE_INFRA: ${{ github.workspace }}/.release-infra
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout release infrastructure
        uses: actions/checkout@v4
        with:
          # Helpers must come from the revision that defined this workflow,
          # even when the release target predates those helpers.
          ref: ${{ github.workflow_sha }}
          path: .release-infra
          sparse-checkout: scripts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Download and verify desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RELEASE_INFRA/scripts/pack/download_desktop_artifacts.sh" --attempts 2

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Promote versioned files to latest
        if: hashFiles('QwenPaw-Desktop-*/*') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          promote_latest() {
            local dirs="$1"
            local pattern="$2"
            local platform="$3"
            local versioned_name="$4"
            local latest_name="$5"

            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              echo "No ${platform} artifact; skipping latest promotion"
              return 0
            fi

            echo "Promoting ${platform} ${versioned_name} -> ${latest_name}"
            bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${versioned_name}" \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${latest_name}"
            bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${versioned_name}.json" \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${latest_name}.json"
          }

          promote_latest \
            "QwenPaw-Desktop-Windows-*" \
            "QwenPaw-*-win-*.exe" \
            "win" \
            "QwenPaw-${VERSION}-win-x64.exe" \
            "QwenPaw-latest-win-x64.exe"

          promote_latest \
            "QwenPaw-Desktop-macOS-*" \
            "QwenPaw-*-mac-*.zip" \
            "mac" \
            "QwenPaw-${VERSION}-mac-arm64.zip" \
            "QwenPaw-latest-mac-arm64.zip"

          promote_latest \
            "QwenPaw-Desktop-Linux-arm64-*" \
            "QwenPaw-*-linux-*.deb" \
            "linux-arm64" \
            "QwenPaw-${VERSION}-linux-arm64.deb" \
            "QwenPaw-latest-linux-arm64.deb"

      - name: Update desktop index
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Download existing desktop/index.json if exists
          ossutil cp "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json" \
            desktop-index.json 2>/dev/null || cat > desktop-index.json << 'EOF'
          {
            "product": "desktop",
            "updated_at": "",
            "platforms": {},
            "files": {}
          }
          EOF

          merge_metadata() {
            local metadata="$1"
            local dirs="$2"
            local pattern="$3"
            local platform="$4"
            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              return 0
            fi
            python "$RELEASE_INFRA/scripts/pack/generate_oss_metadata.py" \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "$VERSION" \
              --output "${metadata}" \
              --merge-index desktop-index.json \
              --output-index desktop-index.json
          }

          merge_metadata \
            "win-metadata.json" \
            "QwenPaw-Desktop-Windows-*" \
            "QwenPaw-*-win-*.exe" \
            "win"
          merge_metadata \
            "mac-metadata.json" \
            "QwenPaw-Desktop-macOS-*" \
            "QwenPaw-*-mac-*.zip" \
            "mac"
          merge_metadata \
            "linux-arm64-metadata.json" \
            "QwenPaw-Desktop-Linux-arm64-*" \
            "QwenPaw-*-linux-*.deb" \
            "linux-arm64"

          # Upload updated desktop/index.json
          bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
            desktop-index.json \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json"

          echo "✓ Desktop index updated"

      - name: Update main index
        run: |
          # Download main index if exists
          ossutil cp "oss://${OSS_BUCKET}/metadata/index.json" \
            main-index.json 2>/dev/null || cat > main-index.json << 'EOF'
          {
            "version": "1.0",
            "updated_at": "",
            "products": {}
          }
          EOF

          # Ensure desktop product is in main index
          python3 << 'PYTHON'
          import json
          from datetime import datetime, timezone

          with open("main-index.json", "r") as f:
              index = json.load(f)

          index["updated_at"] = datetime.now(timezone.utc).isoformat()

          if "desktop" not in index["products"]:
              index["products"]["desktop"] = {
                  "name": {
                      "zh-CN": "桌面客户端",
                      "en-US": "Desktop Client"
                  },
                  "index_url": "/metadata/apps/desktop/index.json"
              }

          with open("main-index.json", "w") as f:
              json.dump(index, f, indent=2, ensure_ascii=False)
          PYTHON

          # Upload main index
          bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
            main-index.json \
            "oss://${OSS_BUCKET}/metadata/index.json"

          echo "✓ Main index updated"
