# Build QwenPaw Desktop ELECTRON packages and publish them.
# - Windows (NSIS installer), macOS (zip + dmg), Linux arm64 (.deb)
# - Runs on release publish and manual dispatch.
#
# NOTE: this is the legacy, un-gated desktop release path. The standard release
# flow is now release.yml (see RELEASING.md), which builds desktop via
# desktop-build.yml + desktop-publish.yml and gates the web release on the
# desktop build. This workflow is kept as an emergency rollback / standalone
# dispatch. Electron-only: the former Tauri auto-updater manifest is not produced.

name: QwenPaw Desktop Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_oss:
        description: 'Upload to OSS'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  # On release events, fail fast if the DashScope secret is missing.
  # Without it, the verifier would silently skip the LLM chat round
  # and emit a misleading "PASS" — so upstream (agentscope-ai/QwenPaw) still
  # fails closed. Forks keep building the installers instead: the verify
  # actions skip the LLM round when the key is empty, so we only warn.
  check-release-secrets:
    name: Check release secrets (release only)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure DashScope secret is configured
        env:
          QWENPAW_DASHSCOPE_API_KEY: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$QWENPAW_DASHSCOPE_API_KEY" ]; then
            if [ "${{ github.repository }}" = "agentscope-ai/QwenPaw" ]; then
              echo "::error::QWENPAW_DASHSCOPE_API_KEY is not set; release verification cannot validate the LLM chat round. Configure the repo secret before publishing."
              exit 1
            fi
            echo "::warning::QWENPAW_DASHSCOPE_API_KEY is not set; continuing without the LLM chat round verification (fork build)."
            exit 0
          fi
          echo "DashScope secret present"

  # ── Preflight: skip the OSS upload job when OSS credentials are absent ─────
  # A job-level `if` cannot read the secrets context, so the presence check runs
  # as a step whose output gates the upload job: on a fork the job shows as
  # skipped instead of failing at `ossutil config -e` with an empty endpoint.
  oss-secrets:
    name: Check OSS secrets
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check OSS secrets
        id: check
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          if [ -n "$OSS_ENDPOINT" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OSS secrets are not configured; skipping the desktop OSS upload job."
          fi

  build-electron-windows:
    needs: [check-release-secrets]
    if: |
      always() &&
      (needs.check-release-secrets.result == 'success' ||
       needs.check-release-secrets.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Pin the CPython X.Y staged for the backend + helper runtime: it has to
      # match the frozen backend, not whatever `python3` the runner happens to
      # resolve (see the same pin on the Linux arm64 job).
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Set up Rust
        # Builds console/native/computer-use-helper (the Computer Use sidecar the
        # Electron shell spawns); scripts/pack-electron/build_win.sh runs cargo.
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/native/computer-use-helper

      - name: Build Electron Windows package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/pack-electron/build_win.sh

      - name: Generate Windows artifact checksum
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem "dist/QwenPaw-*-win-*.exe")
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($artifacts.Count)"
          }
          $artifact = $artifacts[0]
          $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -Encoding ascii "$($artifact.FullName).sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/QwenPaw-*-win-*.exe
            dist/QwenPaw-*-win-*.exe.sha256

  build-electron-macos:
    needs: [check-release-secrets]
    if: |
      always() &&
      (needs.check-release-secrets.result == 'success' ||
       needs.check-release-secrets.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Pin the CPython X.Y staged for the backend + helper runtime: it has to
      # match the frozen backend, not whatever `python3` the runner happens to
      # resolve (see the same pin on the Linux arm64 job).
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Set up Rust
        # Builds console/native/computer-use-helper (the Computer Use sidecar the
        # Electron shell spawns); build_macos.sh runs cargo and stages the binary.
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/native/computer-use-helper

      - name: Build Electron macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/pack-electron/build_macos.sh
          bash scripts/pack-electron/build_macos.sh

      - name: Generate macOS artifact checksums
        run: |
          shopt -s nullglob
          zips=(dist/QwenPaw-*-mac-*.zip)
          dmgs=(dist/QwenPaw-*-mac-*.dmg)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::Expected exactly one macOS zip, found ${#zips[@]}"
            exit 1
          fi
          for artifact in "${zips[0]}" "${dmgs[0]}"; do
            (
              cd "$(dirname "$artifact")"
              shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256"
            )
          done

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-macOS-${{ steps.version.outputs.version }}
          path: |
            dist/QwenPaw-*-mac-*.zip
            dist/QwenPaw-*-mac-*.zip.sha256
            dist/QwenPaw-*-mac-*.dmg
            dist/QwenPaw-*-mac-*.dmg.sha256

  build-electron-linux-arm64:
    # Backend + Electron shell .deb for Kylin V10 SP1 (glibc 2.31).
    # Runs inside an ubuntu:20.04 arm64 container so the bundled backend/helper
    # link against glibc 2.31.
    needs: [check-release-secrets]
    if: |
      always() &&
      (needs.check-release-secrets.result == 'success' ||
       needs.check-release-secrets.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      QWENPAW_PYTHON_RUNTIME_VERSION: "3.11"
      # electron-builder's bundled fpm is a self-contained *linux-x86* ruby
      # build and there is no arm64 flavour of it, so on this arm64 runner the
      # deb target dies with "Exec format error" right after downloading it.
      # app-builder honours this variable and uses `fpm` from PATH instead.
      USE_SYSTEM_FPM: "true"
    steps:
      - name: Install git (the ubuntu:20.04 image does not ship it)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Install system build dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget file git \
            build-essential pkg-config \
            python3 python3-venv python3-dev \
            dpkg ruby ruby-dev

      - name: Install fpm
        # Only needed because this job builds its deb on arm64 (see
        # USE_SYSTEM_FPM above). Whatever version rubygems resolves is fine --
        # gem only offers releases whose required_ruby_version focal's ruby
        # satisfies. The symlink is belt-and-braces: depending on how the
        # distro configures RubyGems, the executable can land outside PATH.
        run: |
          set -eux
          gem install --no-document fpm
          gem_bindir="$(ruby -e 'print Gem.bindir')"
          if [ ! -x "$gem_bindir/fpm" ]; then
            echo "::error::gem installed fpm but no executable at $gem_bindir/fpm"
            exit 1
          fi
          # On focal, `Gem.bindir` is already /usr/local/bin, so the symlink
          # would be a no-op self-link and `ln -sf src src` exits 1 (and `set -e`
          # then kills the step). Only link when the executable lives elsewhere.
          if [ "$gem_bindir" != "/usr/local/bin" ]; then
            ln -sf "$gem_bindir/fpm" /usr/local/bin/fpm
          fi
          command -v fpm
          fpm --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build Electron Linux package (.deb)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/pack-electron/build_linux.sh
          bash scripts/pack-electron/build_linux.sh

      - name: Generate Linux artifact checksums
        shell: bash
        run: |
          shopt -s nullglob
          debs=(dist/QwenPaw-*-linux-*.deb)
          if [ ${#debs[@]} -ne 1 ]; then
            echo "::error::Expected exactly one Linux .deb, found ${#debs[@]}"
            exit 1
          fi
          for artifact in "${debs[0]}"; do
            (
              cd "$(dirname "$artifact")"
              sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
            )
          done

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Linux-arm64-${{ steps.version.outputs.version }}
          path: |
            dist/QwenPaw-*-linux-*.deb
            dist/QwenPaw-*-linux-*.deb.sha256

  upload-release:
    needs: [build-electron-windows, build-electron-macos, build-electron-linux-arm64]
    if: |
      always() &&
      github.event_name == 'release' &&
      needs.build-electron-windows.result == 'success' &&
      needs.build-electron-macos.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_INFRA: ${{ github.workspace }}/.release-infra
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4

      - name: Checkout release infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-infra
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download and verify desktop installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RELEASE_INFRA/scripts/pack/download_desktop_artifacts.sh" --attempts 2

      - name: Move artifacts to root for upload
        run: |
          mv QwenPaw-Desktop-Windows-*/QwenPaw-*-win-*.exe . 2>/dev/null || true
          mv QwenPaw-Desktop-macOS-*/QwenPaw-*-mac-*.zip . 2>/dev/null || true
          mv QwenPaw-Desktop-Linux-arm64-*/QwenPaw-*-linux-*.deb . 2>/dev/null || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QwenPaw-*-win-*.exe
            QwenPaw-*-win-*.exe.sha256
            QwenPaw-*-mac-*.zip
            QwenPaw-*-mac-*.zip.sha256
            QwenPaw-*-mac-*.dmg
            QwenPaw-*-mac-*.dmg.sha256
            QwenPaw-*-linux-*.deb
            QwenPaw-*-linux-*.deb.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify uploaded Release asset sizes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            QwenPaw-*-win-*.exe
            QwenPaw-*-mac-*.zip
            QwenPaw-*-linux-*.deb
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No uploaded Release assets found to verify"
            exit 1
          fi
          bash "$RELEASE_INFRA/scripts/pack/verify_github_release_assets.sh" \
            "${{ github.event.release.tag_name }}" \
            "${files[@]}"

  upload-oss:
    needs: [build-electron-windows, build-electron-macos, build-electron-linux-arm64, oss-secrets]
    if: |
      always() &&
      needs.oss-secrets.outputs.has-secrets == 'true' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_oss == 'true')) &&
      needs.build-electron-windows.result == 'success' &&
      needs.build-electron-macos.result == 'success'
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'qwenpaw-download' }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL || 'https://download.qwenpaw.agentscope.io/files/apps/desktop' }}
      RELEASE_INFRA: ${{ github.workspace }}/.release-infra
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4

      - name: Checkout release infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-infra
          sparse-checkout: scripts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Download and verify desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RELEASE_INFRA/scripts/pack/download_desktop_artifacts.sh" --attempts 2

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Process and upload Electron artifacts
        if: hashFiles('QwenPaw-Desktop-*/*') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          upload_artifact() {
            local dirs="$1"
            local pattern="$2"
            local platform="$3"
            local versioned_name="$4"
            local latest_name="$5"
            local metadata="$6"

            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              echo "No ${platform} artifact found, skipping"
              return 0
            fi

            echo "Processing ${platform} artifact: ${artifact}"
            python "$RELEASE_INFRA/scripts/pack/generate_oss_metadata.py" \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "${VERSION}" \
              --output "${metadata}"

            bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
              "${artifact}" \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${versioned_name}"
            bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
              "${artifact}" \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${latest_name}"
            bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
              "${metadata}" \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${versioned_name}.json"
            bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
              "${metadata}" \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${latest_name}.json"
          }

          upload_artifact \
            "QwenPaw-Desktop-Windows-*" \
            "QwenPaw-*-win-*.exe" \
            "win" \
            "QwenPaw-${VERSION}-win-x64.exe" \
            "QwenPaw-latest-win-x64.exe" \
            "win-metadata.json"

          upload_artifact \
            "QwenPaw-Desktop-macOS-*" \
            "QwenPaw-*-mac-*.zip" \
            "mac" \
            "QwenPaw-${VERSION}-mac-arm64.zip" \
            "QwenPaw-latest-mac-arm64.zip" \
            "mac-metadata.json"

          upload_artifact \
            "QwenPaw-Desktop-Linux-arm64-*" \
            "QwenPaw-*-linux-*.deb" \
            "linux-arm64" \
            "QwenPaw-${VERSION}-linux-arm64.deb" \
            "QwenPaw-latest-linux-arm64.deb" \
            "linux-arm64-metadata.json"

      - name: Update desktop index
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ossutil cp "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json" \
            desktop-index.json 2>/dev/null || cat > desktop-index.json << 'EOF'
          {
            "product": "desktop",
            "updated_at": "",
            "platforms": {},
            "files": {}
          }
          EOF

          merge_metadata() {
            local metadata="$1"
            local dirs="$2"
            local pattern="$3"
            local platform="$4"
            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              return 0
            fi
            python "$RELEASE_INFRA/scripts/pack/generate_oss_metadata.py" \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "$VERSION" \
              --output "${metadata}" \
              --merge-index desktop-index.json \
              --output-index desktop-index.json
          }

          merge_metadata "win-metadata.json" "QwenPaw-Desktop-Windows-*" "QwenPaw-*-win-*.exe" "win"
          merge_metadata "mac-metadata.json" "QwenPaw-Desktop-macOS-*" "QwenPaw-*-mac-*.zip" "mac"
          merge_metadata "linux-arm64-metadata.json" "QwenPaw-Desktop-Linux-arm64-*" "QwenPaw-*-linux-*.deb" "linux-arm64"

          bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
            desktop-index.json \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json"

      - name: Update main index
        run: |
          ossutil cp "oss://${OSS_BUCKET}/metadata/index.json" \
            main-index.json 2>/dev/null || cat > main-index.json << 'EOF'
          {
            "version": "1.0",
            "updated_at": "",
            "products": {}
          }
          EOF
          python3 << 'PYTHON'
          import json
          from datetime import datetime, timezone

          with open("main-index.json", "r") as f:
              index = json.load(f)
          index["updated_at"] = datetime.now(timezone.utc).isoformat()
          if "desktop" not in index["products"]:
              index["products"]["desktop"] = {
                  "name": {"zh-CN": "桌面客户端", "en-US": "Desktop Client"},
                  "index_url": "/metadata/apps/desktop/index.json",
              }
          with open("main-index.json", "w") as f:
              json.dump(index, f, indent=2, ensure_ascii=False)
          PYTHON
          bash "$RELEASE_INFRA/scripts/pack/oss_copy_with_readback.sh" \
            main-index.json \
            "oss://${OSS_BUCKET}/metadata/index.json"
