name: Verify Desktop (Electron Windows)
description: |
  Install the NSIS-built Electron desktop, launch the shell headless to start
  the bundled backend, and drive the SPA through the shared Playwright UI
  verifier with a standalone headless Chromium. Stop / cleanup / log upload
  steps live in the caller workflow because composite actions cannot use
  `if: always()`.

inputs:
  dashscope-api-key:
    description: DashScope API key (empty -> verifier skips LLM round)
    required: false
    default: ""
  allow-flaky-llm:
    description: If 'true', verifier exits 0 on LLM retry exhaustion
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install verify deps (Playwright + Chromium)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        python -m pip install --upgrade pip
        python -m pip install -r scripts/verify/requirements-verify.txt
        python -m playwright install chromium --with-deps

    - name: Launch Electron (headless backend)
      shell: pwsh
      run: |
        . scripts/verify/launch_electron_windows.ps1

    - name: Verify desktop (Electron)
      shell: pwsh
      env:
        QWENPAW_DASHSCOPE_API_KEY: ${{ inputs.dashscope-api-key }}
        PYTHONIOENCODING: utf-8
        ALLOW_FLAKY_LLM: ${{ inputs.allow-flaky-llm }}
      run: |
        $verifyArgs = @(
          "scripts/verify/desktop_verify.py",
          "--base-url", $env:BASE_URL,
          "--ui-mode", "electron"
        )
        if ($env:ALLOW_FLAKY_LLM -eq "true") {
          $verifyArgs += "--allow-flaky-llm"
        }
        python @verifyArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
